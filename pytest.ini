[pytest]
addopts = -q --ignore=whisper
norecursedirs = whisper PennyGPT-Project .* build dist venv .venv node_modules

# ---------------------------------------------------------------------------
# Canonical test suite.
#
# A bare `pytest` run executes the curated Weeks 8.5-13 feature suite (~408
# tests) — this is the "397/397" suite the project tracks, and it is 100% green
# and fast (~30s). The rest of tests/ is legacy/experimental (live network,
# audio hardware, or stale assertions) and is NOT run by default. See
# QUARANTINE_NOTES.md. To run everything: `pytest tests --run-slow`.
# ---------------------------------------------------------------------------
testpaths =
    tests/test_judgment_engine_phase1a.py
    tests/test_judgment_engine_phase1b.py
    tests/test_judgment_engine_phase1c.py
    tests/test_penny_style_clarifier.py
    tests/test_week8_5_integration.py
    tests/test_hebbian_dimensions.py
    tests/test_hebbian_integration.py
    tests/test_hebbian_manager.py
    tests/test_hebbian_safety.py
    tests/test_hebbian_sequences.py
    tests/test_hebbian_vocabulary.py
    tests/test_outcome_tracker.py
    tests/test_proactivity_budget.py
    tests/test_outcome_integration.py
    tests/test_goal_tracker.py
    tests/test_followup_engine.py
    tests/test_goal_continuity_integration.py
    tests/test_user_belief_store.py
    tests/test_belief_extractor.py
    tests/test_user_model_integration.py
    tests/test_user_model_enhancements.py
    tests/test_llm_registry.py
    tests/test_audio_playback.py

# Per-test timeout so a hung test (network/audio/LLM) can't stall the whole suite.
# 'signal' method (vs 'thread') can interrupt blocking syscalls like a live
# socket read, so a test doing a real network call is actually killed at the
# deadline instead of faulting the whole run.
timeout = 30
timeout_method = signal

markers =
    slow: tests that hit the network, audio devices, or a live LLM (deselect with '-m "not slow"')
